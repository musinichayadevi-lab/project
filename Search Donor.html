<!DOCTYPE html>
<html>
<head>
<title>Search Donor</title>

<style>
body{
background:#ffe5ec;
font-family:Arial;
}

.search{
width:400px;
background:white;
padding:30px;
margin:80px auto;
border-radius:20px;
}

select,input{
width:100%;
padding:12px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#e63946;
color:white;

}

</head>

<body>

<div class="search">

<h2>Search Donor 🔍</h2>

<select>
<option>Select Blood Group</option>
<option>A+</option>
<option>B+</option>
</select>

<input type="text" placeholder="Enter City">

<button>Search</button>

</div>

</body>
</html>
